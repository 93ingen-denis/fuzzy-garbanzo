<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fart Simulator 3000</title>
<style>
  :root { --bg1:#ffe29f; --bg2:#ffa99f; --ink:#3b2314; --card:#fff8ec; --accent:#7a4a21; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; font-family: "Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
    color:var(--ink); background: linear-gradient(160deg,var(--bg1),var(--bg2));
    display:flex; flex-direction:column; align-items:center; padding:20px 16px 40px; overflow-x:hidden;
  }
  h1 { margin:6px 0 0; font-size:clamp(1.8rem,6vw,3rem); text-align:center; }
  .sub { margin:4px 0 14px; opacity:.75; text-align:center; }
  #stage { position:relative; width:160px; height:140px; margin:6px 0 10px; }
  #butt { font-size:100px; line-height:1; position:absolute; left:50%; top:10px; transform:translateX(-50%); user-select:none; }
  .shake { animation: shake .5s; }
  @keyframes shake {
    0%,100%{transform:translateX(-50%) rotate(0)} 15%{transform:translateX(-56%) rotate(-8deg)}
    30%{transform:translateX(-44%) rotate(8deg)} 45%{transform:translateX(-56%) rotate(-6deg)}
    60%{transform:translateX(-44%) rotate(6deg)} 80%{transform:translateX(-52%) rotate(-3deg)}
  }
  .puff { position:fixed; font-size:40px; pointer-events:none; animation: rise 2.2s ease-out forwards; z-index:10; }
  @keyframes rise { 0%{opacity:.95; transform:translate(0,0) scale(.6)} 100%{opacity:0; transform:translate(var(--dx),-220px) scale(2.2)} }
  #controls { display:flex; gap:16px; align-items:center; flex-wrap:wrap; justify-content:center; margin-bottom:14px; }
  #controls label { display:flex; gap:8px; align-items:center; }
  #count { background:var(--card); padding:6px 14px; border-radius:999px; font-weight:bold; box-shadow:0 2px 0 rgba(0,0,0,.15); }
  #grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; width:min(900px,100%); }
  button.f {
    font:inherit; font-size:1.05rem; padding:16px 12px; border:none; border-radius:16px; cursor:pointer;
    background:var(--card); color:var(--ink); box-shadow:0 5px 0 var(--accent); transition:transform .08s, box-shadow .08s;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  button.f:hover { background:#fff; }
  button.f:active, button.f.down { transform:translateY(4px); box-shadow:0 1px 0 var(--accent); }
  button.f .e { font-size:1.8rem; }
  button.f small { opacity:.6; font-size:.75rem; }
  #name { height:1.6em; font-size:1.3rem; font-weight:bold; margin-bottom:8px; text-align:center; }
  footer { margin-top:22px; font-size:.85rem; opacity:.65; text-align:center; }
</style>
</head>
<body>
  <h1>💨 Fart Simulator 3000 💨</h1>
  <div class="sub">Ten premium emissions. Tap a button or press keys 1–0.</div>

  <div id="stage"><div id="butt">🍑</div></div>
  <div id="name">&nbsp;</div>

  <div id="controls">
    <label>🔊 Volume <input id="vol" type="range" min="0" max="100" value="80"></label>
    <div id="count">Farts: 0</div>
  </div>

  <div id="grid"></div>
  <footer>Sounds are synthesized live with the Web Audio API. No farts were harmed.</footer>

<script>
let ctx, master, comp, noiseBuf;
function initAudio() {
  if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain();
  master.gain.value = document.getElementById('vol').value / 100;
  comp = ctx.createDynamicsCompressor();
  master.connect(comp); comp.connect(ctx.destination);
  const len = ctx.sampleRate * 2;
  noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
}
document.getElementById('vol').addEventListener('input', e => {
  if (master) master.gain.value = e.target.value / 100;
});

// One "burst" of flatulence: a flapping, filtered oscillator plus noise.
function seg(o) {
  const p = Object.assign({ t:0, dur:.5, f0:100, f1:70, flutter:45, depth:.8, wave:'sawtooth',
    noise:.15, vol:.6, cutoff:700, wobble:6, wobbleDepth:4, q:3 }, o);
  const now = ctx.currentTime + p.t, end = now + p.dur;

  const osc = ctx.createOscillator();
  osc.type = p.wave;
  osc.frequency.setValueAtTime(p.f0, now);
  osc.frequency.exponentialRampToValueAtTime(Math.max(p.f1, 1), end);

  const wob = ctx.createOscillator(); wob.frequency.value = p.wobble;
  const wobG = ctx.createGain(); wobG.gain.value = p.wobbleDepth;
  wob.connect(wobG); wobG.connect(osc.frequency);

  const filt = ctx.createBiquadFilter();
  filt.type = 'lowpass'; filt.frequency.value = p.cutoff; filt.Q.value = p.q;

  // The "flap": amplitude chopped by a fast square LFO
  const flap = ctx.createGain(); flap.gain.value = 1 - p.depth / 2;
  const lfo = ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = p.flutter;
  const lfoG = ctx.createGain(); lfoG.gain.value = p.depth / 2;
  lfo.connect(lfoG); lfoG.connect(flap.gain);

  const env = ctx.createGain();
  env.gain.setValueAtTime(0, now);
  env.gain.linearRampToValueAtTime(p.vol, now + Math.min(.03, p.dur / 4));
  env.gain.setValueAtTime(p.vol, now + p.dur * .7);
  env.gain.linearRampToValueAtTime(0, end);

  osc.connect(filt); filt.connect(flap); flap.connect(env);

  if (p.noise > 0) {
    const n = ctx.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const nf = ctx.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = Math.max(p.cutoff * 1.5, 300);
    const ng = ctx.createGain(); ng.gain.value = p.noise;
    n.connect(nf); nf.connect(ng); ng.connect(env);
    n.start(now); n.stop(end + .05);
  }
  env.connect(master);
  [osc, wob, lfo].forEach(x => { x.start(now); x.stop(end + .05); });
}

const burst = (n, gap, make) => { for (let i = 0; i < n; i++) seg(make(i, gap * i)); };

const FARTS = [
  { name:'The Classic Toot', emoji:'🎺', puffs:3, play:() =>
      seg({ dur:.45, f0:110, f1:70, flutter:55, depth:.7, noise:.15, cutoff:700 }) },
  { name:'The Squeaker', emoji:'🐭', puffs:2, play:() =>
      seg({ dur:1.1, f0:430, f1:250, flutter:90, depth:.6, noise:.05, cutoff:2600, wobble:12, wobbleDepth:25, vol:.4 }) },
  { name:'Machine Gun', emoji:'🔫', puffs:6, play:() =>
      burst(9, .11, (i, t) => ({ t, dur:.08, f0:140 - i * 3, f1:100, flutter:60, depth:.6, noise:.1, cutoff:900 })) },
  { name:'The Wet One', emoji:'💦', puffs:4, play:() =>
      seg({ dur:1, f0:85, f1:45, flutter:22, depth:1, noise:.55, cutoff:900, wobble:9, wobbleDepth:15, q:6 }) },
  { name:'Silent but Deadly', emoji:'☠️', puffs:8, play:() =>
      seg({ dur:1.8, f0:60, f1:50, flutter:30, depth:.9, noise:.9, cutoff:450, vol:.14 }) },
  { name:'Thunder Rumble', emoji:'⛈️', puffs:5, play:() =>
      seg({ dur:2.4, f0:55, f1:26, flutter:17, depth:.6, noise:.4, cutoff:300, vol:.95, q:2 }) },
  { name:'The Trumpet', emoji:'🎷', puffs:3, play:() => {
      seg({ t:0, dur:.4, f0:233, f1:230, wave:'square', flutter:7, depth:.15, noise:.02, cutoff:1800, vol:.35 });
      seg({ t:.42, dur:.7, f0:311, f1:300, wave:'square', flutter:7, depth:.15, noise:.02, cutoff:1800, vol:.35 }); } },
  { name:'Balloon Release', emoji:'🎈', puffs:3, play:() =>
      seg({ dur:1.5, f0:520, f1:110, flutter:70, depth:.8, noise:.08, cutoff:2300, wobble:15, wobbleDepth:35, vol:.4 }) },
  { name:'Double Barrel', emoji:'🔫', puffs:5, play:() => {
      seg({ t:0, dur:.4, f0:120, f1:75, flutter:50, depth:.7, noise:.15, cutoff:750 });
      seg({ t:.5, dur:.55, f0:95, f1:55, flutter:42, depth:.8, noise:.2, cutoff:700 }); } },
  { name:'The Grand Finale', emoji:'🎆', puffs:12, play:() => {
      seg({ t:0, dur:.4, f0:115, f1:75, flutter:55, depth:.7 });
      burst(6, .1, (i, t) => ({ t:.5 + t, dur:.07, f0:150 - i * 5, f1:100, flutter:60, depth:.6, cutoff:900 }));
      seg({ t:1.2, dur:.9, f0:85, f1:45, flutter:22, depth:1, noise:.5, cutoff:900, wobble:9, wobbleDepth:15, q:6 });
      seg({ t:2.2, dur:1.1, f0:420, f1:200, flutter:85, depth:.6, noise:.05, cutoff:2500, wobble:12, wobbleDepth:25, vol:.4 });
      seg({ t:3.3, dur:2, f0:55, f1:26, flutter:17, depth:.6, noise:.4, cutoff:300, vol:.95, q:2 }); } },
];

const grid = document.getElementById('grid');
const nameEl = document.getElementById('name');
const countEl = document.getElementById('count');
const butt = document.getElementById('butt');
let count = 0;

function puffs(n) {
  const r = butt.getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'puff'; el.textContent = Math.random() < .5 ? '💨' : '☁️';
    el.style.left = (r.left + r.width / 2 - 20 + (Math.random() * 60 - 30)) + 'px';
    el.style.top = (r.top + r.height - 20) + 'px';
    el.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
    el.style.animationDelay = (i * 0.08) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600 + i * 80);
  }
}

function fire(i) {
  initAudio();
  const f = FARTS[i];
  f.play();
  nameEl.textContent = f.emoji + ' ' + f.name;
  countEl.textContent = 'Farts: ' + (++count);
  butt.classList.remove('shake'); void butt.offsetWidth; butt.classList.add('shake');
  puffs(f.puffs);
}

FARTS.forEach((f, i) => {
  const b = document.createElement('button');
  b.className = 'f'; b.dataset.i = i;
  b.innerHTML = `<span class="e">${f.emoji}</span><span>${f.name}</span><small>key ${(i + 1) % 10}</small>`;
  b.addEventListener('click', () => fire(i));
  grid.appendChild(b);
});

document.addEventListener('keydown', e => {
  if (e.repeat || !/^[0-9]$/.test(e.key)) return;
  const i = e.key === '0' ? 9 : Number(e.key) - 1;
  const b = grid.children[i];
  b.classList.add('down'); setTimeout(() => b.classList.remove('down'), 120);
  fire(i);
});
</script>
</body>
</html>
