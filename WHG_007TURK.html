cv.onpointermove=e=>{if(e.pointerType!=='touch'){setM(e);return}if(dp&&e.pointerId===dp.id){const r=cv.getBoundingClientRect(),k=1.5*CW/r.width;mx=cl(mx+(e.clientX-dp.x)*k,0,CW);my=cl(my+(e.clientY-dp.y)*k,0,CH);dp.x=e.clientX;dp.y=e.clientY}};
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,e=>{if(dp&&e.pointerId===dp.id)dp=null}));
const hold=(id,k)=>{const el=$(id);el.onpointerdown=e=>{e.preventDefault();actx();btn[k]=1};['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>{btn[k]=0}))};hold('bl','l');hold('br','r');
$('fire').onpointerdown=e=>{e.preventDefault();actx();fire()};$('rel').onpointerdown=e=>{e.preventDefault();reload()};
$('mute').onpointerdown=e=>{e.preventDefault();actx();muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:.8};
addEventListener('keydown',e=>{actx();const k=e.key.toLowerCase();if(k==='a'||k==='arrowleft'){keys.l=1;e.preventDefault()}else if(k==='d'||k==='arrowright'){keys.r=1;e.preventDefault()}else if(e.code==='Space'){e.preventDefault();if(!e.repeat)fire()}else if(k==='r')reload();else if(k==='m')$('mute').onpointerdown(e)});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')keys.l=0;else if(k==='d'||k==='arrowright')keys.r=0});
document.addEventListener('contextmenu',e=>e.preventDefault());
let rt;['resize','orientationchange'].forEach(ev=>addEventListener(ev,()=>{clearTimeout(rt);rt=setTimeout(setMode,150)}));
setMode();mx=CW/2;my=HZ*.9;requestAnimationFrame(loop);
</script></body></html>
