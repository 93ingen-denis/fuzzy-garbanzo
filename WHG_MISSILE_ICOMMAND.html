<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Walid’s Missile Command v1.00 by Claude 2026.10</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#070818;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=400,S=1,ox=0,H=700,GY=650,dpr=1,cw=0,ch=0;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,3);cw=innerWidth;ch=innerHeight;
  cv.width=cw*dpr;cv.height=ch*dpr;
  S=Math.min(cw/W,ch/640);ox=(cw-W*S)/2;H=ch/S;GY=H-52;
}
addEventListener('resize',resize);resize();
function rnd(a,b){return a+Math.random()*(b-a);}

var best=0;try{best=+localStorage.getItem('mc-best')||0;}catch(e){}
var state='ready',score=0,level=1,cities,bases,enemies,mine,expl,spawnLeft,spawnT,bonusT,bonusTxt,overT,marks,lastT=0;
var stars=[];for(var i=0;i<90;i++)stars.push([Math.random(),Math.random(),Math.random()*1.4+.4,Math.random()*6]);
var PAL=['#fff35c','#ff7a3c','#ff4fd8','#4fe8ff','#ffffff'];

function setup(){
  cities=[80,120,160,240,280,320].map(function(x){return{x:x,alive:true,kind:'c'};});
  bases=[36,200,364].map(function(x){return{x:x,alive:true,ammo:10,kind:'b'};});
}
function startWave(){
  enemies=[];mine=[];expl=[];marks=[];
  spawnLeft=Math.min(6+level*3,36);spawnT=1;
  bases.forEach(function(b){b.alive=true;b.ammo=10;});
  state='play';
}
function newGame(){score=0;level=1;setup();startWave();}

function targets(){return cities.concat(bases).filter(function(t){return t.alive;});}
function spawnEnemy(x,y){
  var ts=targets();if(!ts.length)return;
  var t=ts[Math.floor(Math.random()*ts.length)];
  var sp=26+level*4+rnd(0,14),dx=t.x-x,dy=GY-y,d=Math.hypot(dx,dy);
  enemies.push({x0:x,y0:y,x:x,y:y,vx:dx/d*sp,vy:dy/d*sp,t:t,
    split:level>=2&&y<5&&Math.random()<Math.min(.5,.12+level*.04),sy:rnd(110,230)});
}
function fire(tx,ty){
  if(state!=='play'||ty>GY-26)return;
  var best_=null,bd=1e9;
  bases.forEach(function(b){if(b.alive&&b.ammo>0){var d=Math.abs(b.x-tx);if(d<bd){bd=d;best_=b;}}});
  if(!best_)return;
  best_.ammo--;
  var sx=best_.x,sy=GY-14,dx=tx-sx,dy=ty-sy,d=Math.hypot(dx,dy)||1,sp=300;
  mine.push({x0:sx,y0:sy,x:sx,y:sy,tx:tx,ty:ty,vx:dx/d*sp,vy:dy/d*sp,d:d,tr:0});
  marks.push({x:tx,y:ty,l:d/sp});
}
function pointer(e){
  e.preventDefault();
  if(state==='ready'||(state==='over'&&overT<=0)){newGame();return;}
  var r=cv.getBoundingClientRect();
  fire((e.clientX-r.left-ox)/S,(e.clientY-r.top)/S);
}
cv.addEventListener('pointerdown',pointer);
addEventListener('keydown',function(e){if(e.key==='Enter'&&(state==='ready'||state==='over'))newGame();});

function addScore(n){score+=n;if(score>best){best=score;try{localStorage.setItem('mc-best',best);}catch(e){}}}
function boom(x,y,R,kind){expl.push({x:x,y:y,R:R,t:0,k:kind});}
function kill(t){t.alive=false;}

function update(dt){
  expl.forEach(function(e){e.t+=dt;e.r=e.R*Math.sin(Math.PI*Math.min(1,e.t/(e.k==='p'?1.1:.7)));});
  expl=expl.filter(function(e){return e.t<(e.k==='p'?1.1:.7);});
  marks.forEach(function(m){m.l-=dt;});marks=marks.filter(function(m){return m.l>0;});
  if(state==='bonus'){bonusT-=dt;if(bonusT<=0){level++;startWave();}return;}
  if(state==='over'){overT-=dt;}
  if(state!=='play'&&state!=='over')return;
  // player missiles
  for(var i=mine.length-1;i>=0;i--){
    var m=mine[i];m.x+=m.vx*dt;m.y+=m.vy*dt;
    if(Math.hypot(m.x-m.x0,m.y-m.y0)>=m.d){boom(m.tx,m.ty,34,'p');mine.splice(i,1);}
  }
  if(state==='over'){enemiesMove(dt,false);return;}
  // spawn
  spawnT-=dt;
  if(spawnLeft>0&&spawnT<=0){
    spawnLeft--;spawnT=rnd(.4,1.4)/(1+level*.12);
    spawnEnemy(rnd(10,W-10),0);
  }
  enemiesMove(dt,true);
  if(!cities.some(function(c){return c.alive;})){state='over';overT=1.5;return;}
  if(spawnLeft<=0&&!enemies.length&&!mine.length){
    var ca=cities.filter(function(c){return c.alive;}).length;
    var am=0;bases.forEach(function(b){if(b.alive)am+=b.ammo;});
    var bonus=ca*100+am*5;addScore(bonus);
    bonusTxt='Cities '+ca+' x 100 + Missiles '+am+' x 5 = '+bonus;
    state='bonus';bonusT=2.6;
  }
}
function enemiesMove(dt,live){
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    e.x+=e.vx*dt;e.y+=e.vy*dt;
    if(live&&e.split&&e.y>e.sy){e.split=false;
      var n=Math.random()<.5?2:3;for(var k=0;k<n;k++)spawnEnemy(e.x,e.y);}
    var hit=false;
    for(var j=0;j<expl.length;j++){var x=expl[j];
      if(x.k==='p'&&Math.hypot(x.x-e.x,x.y-e.y)<x.r){hit=true;break;}}
    if(hit){if(live)addScore(25);boom(e.x,e.y,16,'x');enemies.splice(i,1);continue;}
    if(e.y>=GY-4||(Math.abs(e.x-e.t.x)<3&&e.y>GY-14)){
      boom(e.x,GY-4,24,'e');
      cities.concat(bases).forEach(function(t){if(t.alive&&Math.abs(t.x-e.x)<22)kill(t);});
      enemies.splice(i,1);
    }
  }
}

function text(str,x,y,col,al,sz){
  ctx.fillStyle=col;ctx.textAlign=al||'left';
  ctx.font='700 '+(sz||14)+'px "Courier New",monospace';ctx.fillText(str,x,y);
}

function drawBg(t){
  var g=ctx.createLinearGradient(0,0,0,ch);
  g.addColorStop(0,'#04051a');g.addColorStop(.55,'#241048');g.addColorStop(.85,'#7a2d5e');g.addColorStop(1,'#d9663f');
  ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);
  stars.forEach(function(s){
    var tw=.5+.5*Math.sin(t/650+s[3]);
    ctx.fillStyle='rgba(255,255,255,'+(0.3+tw*.6)+')';
    ctx.fillRect(s[0]*cw,s[1]*GY*S*.8,s[2],s[2]);
  });
  // ground
  var gy=GY*S;
  ctx.beginPath();ctx.moveTo(0,ch);ctx.lineTo(0,gy+4*S);
  for(var x=0;x<=cw;x+=14)ctx.lineTo(x,gy+4*S+Math.sin(x/48)*3*S+Math.sin(x/17)*1.5*S);
  ctx.lineTo(cw,ch);ctx.closePath();
  var gg=ctx.createLinearGradient(0,gy,0,ch);gg.addColorStop(0,'#ffb347');gg.addColorStop(1,'#a8461f');
  ctx.fillStyle=gg;ctx.fill();
}

function drawCity(c){
  if(!c.alive){ctx.fillStyle='#5b3a3a';ctx.fillRect(c.x-12,GY-3,24,3);ctx.fillRect(c.x-6,GY-6,5,3);return;}
  var hs=[10,16,12,20,9],cols=['#4fe8ff','#7fb5ff','#4fe8ff','#9af0ff','#7fb5ff'];
  for(var i=0;i<5;i++){
    var x=c.x-13+i*5.4,h=hs[i];
    ctx.fillStyle=cols[i];ctx.fillRect(x,GY-h,5,h);
    ctx.fillStyle='#fff35c';ctx.fillRect(x+1,GY-h+2,1.5,1.5);if(h>12)ctx.fillRect(x+2.5,GY-h+6,1.5,1.5);
  }
}
function drawBase(b){
  if(!b.alive){ctx.fillStyle='#5b3a3a';ctx.fillRect(b.x-14,GY-3,28,3);return;}
  ctx.fillStyle='#3dff6a';
  ctx.beginPath();ctx.moveTo(b.x-18,GY+2);ctx.lineTo(b.x-8,GY-12);ctx.lineTo(b.x+8,GY-12);ctx.lineTo(b.x+18,GY+2);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff35c';
  var n=b.ammo,row=0,k=0;
  while(n>0){var cnt=Math.min(n,4-row);
    for(var i=0;i<cnt;i++)ctx.fillRect(b.x-(cnt*4)/2+i*4+.5,GY-2-row*4,3,3);
    n-=cnt;row++;if(row>3)break;}
  text(b.ammo>0?String(b.ammo):'OUT',b.x,GY+18,b.ammo>0?'#fff':'#ff5a5a','center',11);
}

function draw(t){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawBg(t);
  ctx.setTransform(dpr*S,0,0,dpr*S,ox*dpr,0);
  ctx.lineCap='round';
  cities.forEach(drawCity);bases.forEach(drawBase);
  // enemy trails
  enemies.forEach(function(e){
    ctx.strokeStyle='rgba(255,90,120,.85)';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(e.x0,e.y0);ctx.lineTo(e.x,e.y);ctx.stroke();
    ctx.fillStyle='#fff';ctx.fillRect(e.x-1.5,e.y-1.5,3,3);
  });
  mine.forEach(function(m){
    ctx.strokeStyle='rgba(79,232,255,.9)';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(m.x0,m.y0);ctx.lineTo(m.x,m.y);ctx.stroke();
    ctx.fillStyle='#fff';ctx.fillRect(m.x-1.5,m.y-1.5,3,3);
  });
  marks.forEach(function(m){
    ctx.strokeStyle='#3dff6a';ctx.lineWidth=1.5;ctx.beginPath();
    ctx.moveTo(m.x-5,m.y-5);ctx.lineTo(m.x+5,m.y+5);ctx.moveTo(m.x+5,m.y-5);ctx.lineTo(m.x-5,m.y+5);ctx.stroke();
  });
  expl.forEach(function(e){
    var c=PAL[Math.floor(t/70+e.x)%PAL.length];
    if(e.k==='e')c=PAL[Math.floor(t/70)%2];
    ctx.globalAlpha=.88;ctx.fillStyle=c;ctx.beginPath();ctx.arc(e.x,e.y,Math.max(0,e.r),0,6.2832);ctx.fill();
    ctx.globalAlpha=.9;ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.arc(e.x,e.y,Math.max(0,e.r*.55),0,6.2832);ctx.stroke();
  });
  ctx.globalAlpha=1;
  // HUD
  ctx.setTransform(dpr,0,0,dpr,0,0);
  text('SCORE '+score,ox+14*S,28,'#fff','left',14);
  text('BEST '+best,ox+14*S,46,'#b9b3e8','left',12);
  text('WAVE '+level,ox+W*S-14*S,28,'#fff35c','right',14);
  var cx=cw/2,cy=ch*.3;
  if(state==='ready'){
    ctx.fillStyle='rgba(4,5,26,.72)';ctx.fillRect(0,cy-48,cw,215);
    text('Walid’s Missile Command',cx,cy,'#3dff6a','center',Math.min(22,cw/17));
    text('v1.00 by Claude 2026.10',cx,cy+24,'#b9b3e8','center',13);
    text('Tap the sky to launch a counter-missile.',cx,cy+60,'#fff','center',Math.min(14,cw/27));
    text('The blast stops enemy missiles.',cx,cy+80,'#fff','center',Math.min(14,cw/27));
    text('Protect your cities.',cx,cy+100,'#4fe8ff','center',14);
    text('Tap to start',cx,cy+142,'#3dff6a','center',18);
  }else if(state==='bonus'){
    ctx.fillStyle='rgba(4,5,26,.7)';ctx.fillRect(0,cy-40,cw,100);
    text('Wave '+level+' cleared',cx,cy,'#fff35c','center',24);
    text(bonusTxt,cx,cy+30,'#fff','center',Math.min(13,cw/30));
  }else if(state==='over'){
    ctx.fillStyle='rgba(4,5,26,.72)';ctx.fillRect(0,cy-40,cw,140);
    text('All cities lost',cx,cy,'#ff5a7a','center',26);
    text('Score '+score+'  Wave '+level,cx,cy+30,'#fff','center',16);
    if(overT<=0)text('Tap to play again',cx,cy+66,'#3dff6a','center',16);
  }
}

function loop(t){
  var dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;
  update(dt);draw(t);requestAnimationFrame(loop);
}
setup();enemies=[];mine=[];expl=[];marks=[];
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
